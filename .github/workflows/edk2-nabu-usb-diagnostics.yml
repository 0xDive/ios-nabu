name: Build nabu EDK2 image-protection A/B (experimental)

on:
  push:
    branches:
      - experiment/nabu-image-protection-off
    paths:
      - stage12/uefi-usb/**
      - .github/workflows/edk2-nabu-usb-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nabu-image-protection-off-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UPSTREAM_SHA: e1952621f419f8db60ed28271264e1b5184c571d
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout diagnostic overlays
        uses: actions/checkout@v4

      - name: Install EDK2 dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev iasl nasm git gettext clang llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python-is-python3 python3-pil python3-git python3-setuptools \
            device-tree-compiler abootimg bc bison flex libssl-dev \
            curl cpio gzip xz-utils file

      - name: Checkout exact upstream EDK2 and dependencies
        shell: bash
        run: |
          set -euo pipefail
          git init -q edk2-msm
          git -C edk2-msm remote add origin https://github.com/edk2-porting/edk2-msm.git
          git -C edk2-msm fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C edk2-msm checkout --detach -q FETCH_HEAD
          test "$(git -C edk2-msm rev-parse HEAD)" = "$UPSTREAM_SHA"
          git -C edk2-msm submodule update --init --recursive --depth 1 --jobs 4

      - name: Include read-only UEFI diagnostics and firmware-volume startup script
        shell: bash
        run: |
          set -euo pipefail
          DEST=edk2-msm/Platform/Xiaomi/sm8150/NabuUsbDiag
          mkdir -p "$DEST"
          cp stage12/uefi-usb/NabuUsbDiag.c "$DEST/"
          cp stage12/uefi-usb/NabuUsbDiag.inf "$DEST/"
          cp stage12/uefi-usb/startup.nsh "$DEST/"
          python3 - <<'PY'
          from pathlib import Path

          dsc = Path("edk2-msm/Platform/Xiaomi/sm8150/nabu.dsc")
          original = dsc.read_text()
          assert "NabuUsbDiag.inf" not in original
          # The *only* firmware behavior change vs the crashing diagnostic 05:
          # disable FV-image PE/COFF section R/O+NX memory protections.
          # Do not alter the DXE driver order, chipset MMIO, PMIC or memory map.
          section = "[PcdsFixedAtBuild.common]\n"
          pcd = "  gEfiMdeModulePkgTokenSpaceGuid.PcdImageProtectionPolicy|0x00000000\n"
          assert original.count(section) == 1, "nabu fixed-build PCD section changed upstream"
          assert "PcdImageProtectionPolicy" not in original, "Unexpected pre-existing override"
          modified = original.replace(section, section + pcd, 1)
          assert modified.count(pcd) == 1
          dsc.write_text(
              modified
              + "\n[Components.common]\n"
              + "  Platform/Xiaomi/sm8150/NabuUsbDiag/NabuUsbDiag.inf\n"
          )
          print("nabu DSC PcdImageProtectionPolicy overridden to 0 (DEBUG ONLY).")

          fdf = Path("edk2-msm/Platform/Qualcomm/sm8150/sm8150.fdf")
          original = fdf.read_text()
          marker = "[FV.FVMAIN_COMPACT]"
          assert original.count(marker) == 1
          assert "NabuUsbDiag.inf" not in original
          inject = """
            # Nabu USB protocol inventory and read-only Shell startup script
            INF Platform/Xiaomi/sm8150/NabuUsbDiag/NabuUsbDiag.inf
            FILE FREEFORM = 2A1A47BD-DA2D-475C-A52A-6D698BFE122D {
              SECTION RAW = Platform/Xiaomi/sm8150/NabuUsbDiag/startup.nsh
              SECTION UI = "startup.nsh"
            }

          """
          fdf.write_text(original.replace(marker, inject + marker, 1))
          print("Overlay integrated into nabu DSC and SM8150 FV (no upstream patch).")
          PY

      - name: Build nabu DEBUG image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd edk2-msm
          ./build.sh --device nabu --release DEBUG --outputdir "$GITHUB_WORKSPACE/out"

      - name: Assert image-protection override reached DxeCore build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          base = pathlib.Path("out/workspace/Build/nabu/DEBUG_CLANG38/AARCH64/MdeModulePkg/Core/Dxe/DxeMain")
          headers = list(base.rglob("AutoGen.h"))
          assert headers, f"No DxeCore AutoGen.h under {base}"
          found = []
          for header in headers:
              src = header.read_text(errors="replace")
              matches = re.findall(
                  r"(?m)^\s*#\s*define\s+_PCD_VALUE_PcdImageProtectionPolicy\s+([^\s]+)", src
              )
              for match in matches:
                  found.append((header, match))
          assert found, "PcdImageProtectionPolicy fixed-at-build macro not found in DxeCore AutoGen.h"
          for path, value in found:
              numeric = re.sub(r"[uUlL]+$", "", value.strip("()"))
              assert int(numeric, 0) == 0, f"PCD override not active in {path}: {value}"
              print(f"Verified DxeCore: _PCD_VALUE_PcdImageProtectionPolicy={value} ({path})")
          PY

      - name: Check image and EFI binary
        shell: bash
        run: |
          set -euo pipefail
          test -s out/boot-nabu.img
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack_from

          image = Path("out/boot-nabu.img").read_bytes()
          assert image.startswith(b"ANDROID!"), "Missing Android boot header"
          assert unpack_from("<I", image, 8)[0] != 0, "Empty kernel field"
          assert unpack_from("<I", image, 40)[0] == 3, "Expected v3 boot header"
          print("Android boot image v3 recognized.")
          PY
          EFI="$(find out/workspace/Build -iname 'NabuUsbDiag.efi' -type f -print -quit)"
          test -n "$EFI"
          test -s "$EFI"
          file "$EFI"
          printf 'Source: edk2-porting/edk2-msm %s\n' "$UPSTREAM_SHA" > out/README-FIRST.txt
          printf 'Variant: DIAG 05 with PcdImageProtectionPolicy=0 (DEBUG ONLY)\n' >> out/README-FIRST.txt
          cat >> out/README-FIRST.txt <<'EOF'
          EXPERIMENTAL DIAGNOSTIC 06 - NOT SAFE FOR PRODUCTION.
          The only firmware behavior difference from CRASHING DIAG 05 is:
          PcdImageProtectionPolicy=0. PE/COFF FV-image memory R/O and NX
          protection is DISABLED. Memory isolation is weakened.
          Original Qualcomm driver order and image binaries are retained.
          Do not use as a normal UEFI firmware or install permanently.
          If it boots, this is a clue for MMU/image permission investigation,
          NOT A USB FIX. If it crashes, return to DIAG 04.
          Experimental Xiaomi Pad 5 (nabu) EDK2 USB diagnostic.
          EFI Shell auto-runs startup.nsh and prints PCI root bridge, PCI IO,
          USB2 HC, legacy USB HC, USB IO and USBFN protocol counts, as well as
          firmware-loaded driver images and driver binding registrations.
          A loaded image or binding is NOT evidence that the controller started.
          Diagnostic 05 attempts RAM-only LoadImage() of the PCI host bridge PE32
          and then UnloadImage(), strictly without calling StartImage(),
          ConnectController() or DriverBinding.Start(). The test allocates RAM
          and temporarily installs an EFI image handle. Hardware is not initialized.
          DO NOT FLASH any partition. Only test with temporary fastboot boot.
          The application enumerates protocol handles and reads host port status.
          It does not write to UFS, partitions, UEFI variables or hardware registers.
          It does load/unload the candidate PCI image into/from RAM without executing it.
          If no diagnostic is shown, firmware FV Shell startup path may differ.
          EOF
          (cd out && sha256sum boot-nabu.img > SHA256SUMS)
          cat out/SHA256SUMS

      - name: Upload experimental image
        uses: actions/upload-artifact@v4
        with:
          name: nabu-edk2-imageprot-off-06
          path: |
            out/boot-nabu.img
            out/SHA256SUMS
            out/README-FIRST.txt
          if-no-files-found: error
          retention-days: 14
