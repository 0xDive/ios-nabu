name: Nabu EDK2 PCI and USB host order experiments

on:
  push:
    branches:
      - experiment/nabu-pci-usb-driver-order
    paths:
      - stage12/uefi-usb/**
      - .github/workflows/edk2-nabu-usb-diagnostics.yml
      - .github/workflows/edk2-nabu-pci-order.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nabu-pci-usb-order-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [pci-first, usb-stack-first]
    env:
      EXPERIMENT_VARIANT: ${{ matrix.variant }}
      UPSTREAM_SHA: e1952621f419f8db60ed28271264e1b5184c571d
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout diagnostic overlays
        uses: actions/checkout@v4

      - name: Install EDK2 dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev iasl nasm git gettext clang llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python-is-python3 python3-pil python3-git python3-setuptools \
            device-tree-compiler abootimg bc bison flex libssl-dev \
            curl cpio gzip xz-utils file

      - name: Checkout exact upstream EDK2 and dependencies
        shell: bash
        run: |
          set -euo pipefail
          git init -q edk2-msm
          git -C edk2-msm remote add origin https://github.com/edk2-porting/edk2-msm.git
          git -C edk2-msm fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C edk2-msm checkout --detach -q FETCH_HEAD
          test "$(git -C edk2-msm rev-parse HEAD)" = "$UPSTREAM_SHA"
          git -C edk2-msm submodule update --init --recursive --depth 1 --jobs 4

      - name: Include read-only UEFI diagnostics and firmware-volume startup script
        shell: bash
        run: |
          set -euo pipefail
          DEST=edk2-msm/Platform/Xiaomi/sm8150/NabuUsbDiag
          mkdir -p "$DEST"
          cp stage12/uefi-usb/NabuUsbDiag.c "$DEST/"
          cp stage12/uefi-usb/NabuUsbDiag.inf "$DEST/"
          cp stage12/uefi-usb/startup.nsh "$DEST/"
          python3 - <<'PY'
          from pathlib import Path

          dsc = Path("edk2-msm/Platform/Xiaomi/sm8150/nabu.dsc")
          original = dsc.read_text()
          assert "NabuUsbDiag.inf" not in original
          dsc.write_text(
              original
              + "\n[Components.common]\n"
              + "  Platform/Xiaomi/sm8150/NabuUsbDiag/NabuUsbDiag.inf\n"
          )

          fdf = Path("edk2-msm/Platform/Qualcomm/sm8150/sm8150.fdf")
          original = fdf.read_text()
          marker = "[FV.FVMAIN_COMPACT]"
          assert original.count(marker) == 1
          assert "NabuUsbDiag.inf" not in original
          inject = """
            # Nabu USB protocol inventory and read-only Shell startup script
            INF Platform/Xiaomi/sm8150/NabuUsbDiag/NabuUsbDiag.inf
            FILE FREEFORM = 2A1A47BD-DA2D-475C-A52A-6D698BFE122D {
              SECTION RAW = Platform/Xiaomi/sm8150/NabuUsbDiag/startup.nsh
              SECTION UI = "startup.nsh"
            }

          """
          fdf.write_text(original.replace(marker, inject + marker, 1))
          # Experimental order-only change to Qualcomm vendor DXE a-priori list.
          # Preserve the existing driver modules and their binaries.
          import re
          apriori_path = Path("edk2-msm/Platform/Qualcomm/sm8150/Apriori.fdf.inc")
          atext = apriori_path.read_text()
          def move_before(data, driver_guid, target_guid):
              pattern = re.compile(
                  r"(?m)^  FILE DRIVER = " + re.escape(driver_guid)
                  + r" \{\n(?:.*\n)*?^  \}\n\n")
              hits = list(pattern.finditer(data))
              assert len(hits) == 1, f"expected one driver {driver_guid}, found {len(hits)}"
              match = hits[0]
              block = match.group(0)
              data = data[:match.start()] + data[match.end():]
              target = f"  FILE DRIVER = {target_guid} {{"
              assert data.count(target) == 1, f"missing/duplicate target {target_guid}"
              return data.replace(target, block + target, 1)

          pci = "c62f4b20-681e-11df-8f0d-0002a5d5c51b"
          xhci = "BEB12BEE-F6E1-11E1-9FB8-6C626DE4AEB1"
          usbconfig = "cd823a4d-7dec-4531-ae5d-4134fa4127b8"
          usbinit = "0A134F0E-075E-40B3-9C63-3B3906804663"
          assert atext.index(f"  FILE DRIVER = {xhci} {{") < atext.index(f"  FILE DRIVER = {pci} {{")
          atext = move_before(atext, pci, xhci)
          if __import__("os").environ["EXPERIMENT_VARIANT"] == "usb-stack-first":
              atext = move_before(atext, usbconfig, pci)
              atext = move_before(atext, usbinit, pci)
          elif __import__("os").environ["EXPERIMENT_VARIANT"] != "pci-first":
              raise ValueError("unknown variant")

          apriori_path.write_text(atext)
          assert atext.index(f"  FILE DRIVER = {pci} {{") < atext.index(f"  FILE DRIVER = {xhci} {{")
          # Stamp on-screen output with the experiment variant.
          diag_path = Path("edk2-msm/Platform/Xiaomi/sm8150/NabuUsbDiag/NabuUsbDiag.c")
          diag = diag_path.read_text()
          assert diag.count("NABU USB DIAG 04: READ ONLY") == 1
          marker = "NABU PCI FIRST: READ ONLY" if __import__("os").environ["EXPERIMENT_VARIANT"] == "pci-first" else "NABU USB STACK FIRST: READ ONLY"
          diag_path.write_text(diag.replace("NABU USB DIAG 04: READ ONLY", marker))
          print(f"Applied {__import__('os').environ['EXPERIMENT_VARIANT']} DXE apriori order experiment.")
          print("Overlay integrated into nabu DSC and SM8150 FV (no upstream patch).")
          PY

      - name: Build nabu DEBUG image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd edk2-msm
          ./build.sh --device nabu --release DEBUG --outputdir "$GITHUB_WORKSPACE/out"

      - name: Check image and EFI binary
        shell: bash
        run: |
          set -euo pipefail
          test -s out/boot-nabu.img
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack_from

          image = Path("out/boot-nabu.img").read_bytes()
          assert image.startswith(b"ANDROID!"), "Missing Android boot header"
          assert unpack_from("<I", image, 8)[0] != 0, "Empty kernel field"
          assert unpack_from("<I", image, 40)[0] == 3, "Expected v3 boot header"
          print("Android boot image v3 recognized.")
          PY
          EFI="$(find out/workspace/Build -iname 'NabuUsbDiag.efi' -type f -print -quit)"
          test -n "$EFI"
          test -s "$EFI"
          file "$EFI"
          printf 'Source: edk2-porting/edk2-msm %s\n' "$UPSTREAM_SHA" > out/README-FIRST.txt
          printf 'Variant: %s\n' "$EXPERIMENT_VARIANT" >> out/README-FIRST.txt
          cat >> out/README-FIRST.txt <<'EOF'
          Experimental nabu EDK2 image testing driver dispatch order only.
          PCI-first: move PciHostBridge ahead of XhciPciEmulation in DXE APRIORI.
          USB-stack-first: also move UsbConfig and UsbInit ahead of PCI bridge.
          Upstream vendor binaries, PMIC registers and DTB are unchanged.
          Temporary fastboot boot ONLY. DO NOT FLASH any partition.
          Hardware boot is not verified; this may cause black screen, hang, or restart.
          Keep known working boot-nabu.img as a fallback.
          Experimental Xiaomi Pad 5 (nabu) EDK2 USB diagnostic.
          EFI Shell auto-runs startup.nsh and prints PCI root bridge, PCI IO,
          USB2 HC, legacy USB HC, USB IO and USBFN protocol counts, as well as
          firmware-loaded driver images and driver binding registrations.
          A loaded image or binding is NOT evidence that the controller started.
          Diagnostic 04 also evaluates firmware-volume DXE dependency expressions
          for the PCI bridge and USB chain without dispatching drivers.
          DO NOT FLASH any partition. Only test with temporary fastboot boot.
          The application enumerates protocol handles and reads host port status.
          It does not write to UFS, partitions, UEFI variables or hardware registers.
          If no diagnostic is shown, firmware FV Shell startup path may differ.
          EOF
          (cd out && sha256sum boot-nabu.img > SHA256SUMS)
          cat out/SHA256SUMS

      - name: Upload experimental image
        uses: actions/upload-artifact@v4
        with:
          name: nabu-edk2-pci-order-${{ matrix.variant }}-01
          path: |
            out/boot-nabu.img
            out/SHA256SUMS
            out/README-FIRST.txt
          if-no-files-found: error
          retention-days: 14
