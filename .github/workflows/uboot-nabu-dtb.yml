name: Stage 8.1 - public nabu DTS with U-Boot (compile-only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'stage8/tools/inspect_nabu_source.py'
      - 'stage8/tests/test_inspect_nabu_source.py'
      - 'stage8/BOARD_GAPS.md'
      - 'stage9/**'
      - 'stage10/**'
      - '.github/workflows/uboot-nabu-dtb.yml'

permissions:
  contents: read

concurrency:
  group: stage8-nabu-dts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-nabu-dts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UBOOT_SHA: ece349ade2973e220f524ce59e59711cc919263f
      NABU_SOURCE_SHA: 4e6d08bb1b467c721e19cd693e4ec7388d982d73
      CROSS_COMPILE: aarch64-linux-gnu-
      ARCH: arm
      DEVICE_TREE: qcom/sm8150-xiaomi-nabu
    steps:
      - uses: actions/checkout@v4
      - name: Offline-source-contract tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s stage8/tests -v
          python3 -m unittest discover -s stage9/tests -v
          python3 -m unittest discover -s stage10/tests -v
      - name: Install cross-compiler and DTB prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            make gcc gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex build-essential device-tree-compiler curl \
            libssl-dev libgnutls28-dev libncurses-dev swig \
            python3-dev python3-pyelftools python3-packaging python3-setuptools

      - name: Obtain exact public source commits
        run: |
          set -euo pipefail
          mkdir -p stage8/out
          git init -q _nabu_uboot
          git -C _nabu_uboot fetch -q --depth=1 \
            https://github.com/u-boot/u-boot "$UBOOT_SHA"
          git -C _nabu_uboot checkout -q FETCH_HEAD
          test "$(git -C _nabu_uboot rev-parse HEAD)" = "$UBOOT_SHA"
          SOURCE="https://raw.githubusercontent.com/SeimoDev/linux-xiaomi-nabu/$NABU_SOURCE_SHA/arch/arm64/boot/dts/qcom"
          DEST="$GITHUB_WORKSPACE/_nabu_uboot/dts/upstream/src/arm64/qcom"
          test -d "$DEST"
          curl -fsSL --retry 3 "$SOURCE/sm8150-xiaomi-nabu.dts" \
            -o "$DEST/sm8150-xiaomi-nabu.dts"
          curl -fsSL --retry 3 "$SOURCE/sm8150-wcd9340.dtsi" \
            -o "$DEST/sm8150-wcd9340.dtsi"
          # Bundled U-Boot v2026.07 DTSI is older than the published nabu
          # Linux tree: pin the matching SoC and PMIC DTSI revisions too.
          # These copies exist ONLY inside the ephemeral CI work tree.
          for NAME in sm8150.dtsi pm8150.dtsi pm8150b.dtsi pm8150l.dtsi; do
            curl -fsSL --retry 3 "$SOURCE/$NAME" -o "$DEST/$NAME"
          done
          sha256sum "$DEST/sm8150-xiaomi-nabu.dts" \
            "$DEST/sm8150-wcd9340.dtsi" "$DEST/sm8150.dtsi" \
            "$DEST/pm8150.dtsi" "$DEST/pm8150b.dtsi" "$DEST/pm8150l.dtsi" \
            | awk '{ n=split($2, parts, "/"); print $1 "  " parts[n] }' \
            > stage8/out/public-source-sha256.txt
          awk 'length($1) != 64 || $1 !~ /^[0-9a-f]+$/ { exit 1 } END {if (NR != 6) exit 1}' \
            stage8/out/public-source-sha256.txt
          python3 stage8/tools/inspect_nabu_source.py \
            --source "$DEST/sm8150-xiaomi-nabu.dts" \
            --report stage8/out/public-nabu-source-contract.json

      - name: Configure known safe USB console options
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/_nabu_uboot"
          BUILD="$GITHUB_WORKSPACE/_nabu_uboot_build"
          make -C "$SRC" O="$BUILD" qcom_defconfig qcom-phone.config
          "$SRC/scripts/config" --file "$BUILD/.config" \
            -e DM_USB_GADGET -e USB_DWC3_GADGET \
            -d FASTBOOT_FLASH -d FASTBOOT_OEM_RUN -d FASTBOOT_CMD_OEM_RUN \
            -d CMD_UMS -d CMD_USB_MASS_STORAGE -d CMD_DFU \
            -d EFI_CAPSULE_ON_DISK -d EFI_RUNTIME_UPDATE_CAPSULE
          make -C "$SRC" O="$BUILD" olddefconfig
          python3 stage8/tools/audit_uboot_config.py \
            --config "$BUILD/.config" \
            --report stage8/out/nabu-dtb-uboot-config.json

      - name: Compile only nabu DTS from matching public SoC/PMIC sources
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/_nabu_uboot"
          BUILD="$GITHUB_WORKSPACE/_nabu_uboot_build"
          mkdir -p "$BUILD"
          # The generic U-Boot make target compiles *all* upstream qcom DTBs.
          # Replacing sm8150.dtsi to match nabu broke an unrelated sm8150-hdk
          # board; use the same pinned U-Boot include tree and isolate nabu.
          # This is a DTS preprocessor and dtc proof, NOT an U-Boot binary.
          if ! {
              gcc -E -P -x assembler-with-cpp -nostdinc -undef -D__DTS__ \
                -I "$SRC/dts/upstream/include" \
                -I "$SRC/dts/upstream/src/arm64/qcom" \
                "$SRC/dts/upstream/src/arm64/qcom/sm8150-xiaomi-nabu.dts" \
                -o "$BUILD/nabu-preprocessed.dts"
              dtc -@ -I dts -O dtb \
                -o "$BUILD/nabu-public-source-only.dtb" \
                "$BUILD/nabu-preprocessed.dts"
            } > stage8/out/nabu-dts-compile.log 2>&1; then
            tail -n 130 stage8/out/nabu-dts-compile.log
            exit 1
          fi
          test -s "$BUILD/nabu-public-source-only.dtb"
          fdtget -t s "$BUILD/nabu-public-source-only.dtb" / compatible \
            | tee stage8/out/nabu-compiled-compatible.txt
          grep -q 'xiaomi,nabu' stage8/out/nabu-compiled-compatible.txt
          grep -q 'qcom,sm8150' stage8/out/nabu-compiled-compatible.txt
          python3 stage9/tools/usb_dtb_gate.py \
            --dtb "$BUILD/nabu-public-source-only.dtb" --kind public \
            --out stage8/out/nabu-usb-dtb-gate.json
          python3 stage10/tools/uboot_usb_driver_gate.py \
            --dtb "$BUILD/nabu-public-source-only.dtb" \
            --config "$BUILD/.config" --uboot "$SRC" \
            --out stage8/out/nabu-uboot-usb-driver-contract.json
          echo 'Public nabu DTB USB topology accepted; runtime PHY/Type-C still unknown.'
      - name: Compile U-Boot ARM64 with only prevalidated nabu DTB (NEVER BOOT)
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/_nabu_uboot"
          BUILD="$GITHUB_WORKSPACE/_nabu_uboot_build"
          # Default U-Boot dts/Makefile builds ALL upstream Qualcomm DTBs,
          # many of which are incompatible with the pinned nabu SoC DTSI.
          # Host-only one-board experiment: use the previously validated
          # nabu binary DTB instead. The Makefile tweak is NOT committed
          # to upstream or presented as device-ready firmware.
          grep -Fq '$(DTB): arch-dtbs $(local_dtbos)' "$SRC/dts/Makefile"
          sed -i 's/$(DTB): arch-dtbs $(local_dtbos)/$(DTB): $(local_dtbos)/' \
            "$SRC/dts/Makefile"
          mkdir -p "$BUILD/dts/upstream/src/arm64/qcom"
          cp "$BUILD/nabu-public-source-only.dtb" \
            "$BUILD/dts/upstream/src/arm64/qcom/sm8150-xiaomi-nabu.dtb"
          if ! make -C "$SRC" O="$BUILD" -j4 DEVICE_TREE="$DEVICE_TREE" \
                > stage8/out/nabu-uboot-compile.log 2>&1; then
            tail -n 120 stage8/out/nabu-uboot-compile.log
            exit 1
          fi
          test -s "$BUILD/u-boot"
          test -s "$BUILD/u-boot.dtb"
          file "$BUILD/u-boot" | tee stage8/out/nabu-uboot-filetype.txt
          grep -Eq 'ARM aarch64|ARM64|aarch64' stage8/out/nabu-uboot-filetype.txt
          fdtget -t s "$BUILD/u-boot.dtb" / compatible \
            | tee stage8/out/nabu-integrated-compatible.txt
          grep -q 'xiaomi,nabu' stage8/out/nabu-integrated-compatible.txt
          sha256sum "$BUILD/u-boot" | awk '{print $1 "  host-only U-Boot ELF (not distributed)"}' \
            > stage8/out/nabu-uboot-elf-sha256.txt
          echo 'Compiled ELF with nabu DTB: NOT VERIFIED ON HARDWARE.'
      - name: Collect diagnostics and disclaimers
        if: always()
        run: |
          mkdir -p stage8/out
          if [ -f stage8/out/nabu-dts-compile.log ]; then
            tail -n 140 stage8/out/nabu-dts-compile.log \
              > stage8/out/nabu-dts-compile-tail.txt
          else
            echo 'Build did not start.' > stage8/out/nabu-dts-compile-tail.txt
          fi
          if [ -f stage8/out/nabu-uboot-compile.log ]; then
            tail -n 120 stage8/out/nabu-uboot-compile.log \
              > stage8/out/nabu-uboot-compile-tail.txt
          else
            echo 'U-Boot ELF assembly did not start.' > stage8/out/nabu-uboot-compile-tail.txt
          fi
          printf 'Host-only Linux nabu DTS / U-Boot ELF. No memory/PHY/USB validation. DO NOT BOOT OR FLASH.\n' \
            > stage8/out/NO_DEVICE_TEST.txt
      - name: Upload sanitized metadata only, no executable or DTB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabu-stage8-public-dts-host-diagnostics
          path: |
            stage8/out/public-source-sha256.txt
            stage8/out/public-nabu-source-contract.json
            stage8/out/nabu-usb-dtb-gate.json
            stage8/out/nabu-uboot-usb-driver-contract.json
            stage8/out/nabu-dtb-uboot-config.json
            stage8/out/nabu-compiled-compatible.txt
            stage8/out/nabu-dts-compile-tail.txt
            stage8/out/nabu-integrated-compatible.txt
            stage8/out/nabu-uboot-filetype.txt
            stage8/out/nabu-uboot-elf-sha256.txt
            stage8/out/nabu-uboot-compile-tail.txt
            stage8/out/NO_DEVICE_TEST.txt
          if-no-files-found: warn
          retention-days: 7
