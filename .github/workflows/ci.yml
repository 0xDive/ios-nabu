name: Verify Stage 3 and Stage 4

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-nabu-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Source and offline unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository contents
        run: |
          set -euo pipefail
          python3 tools/repository_guard.py
          test -s stage3/src/handoff.c
          test -s stage4/tools/mkadt_nabu.py
      - name: Stage 3 Python unit tests
        run: python3 -m unittest discover -s stage3/tests -v
      - name: Stage 4 Python unit tests
        run: python3 -m unittest discover -s stage4/tests -v
      - name: Stage 6 native FDT memory audit tests
        run: python3 -m unittest discover -s stage6/tests -v
      - name: Offline Mach-O/DTB layout tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: XNU staging, boot_args and Stage 5 handoff tests
        run: python3 -m unittest discover -s xnu/tests -v

  arm64:
    name: Cross-compile Stage 3 test shim
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM cross compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm binutils python3
      - name: Build minimal ARM64 diagnostic
        run: bash stage3/build.sh
      - name: Verify generated boot header and ramdisk
        run: |
          python3 -m unittest discover -s stage3/tests -v
          python3 stage3/tools/bootimg.py inspect stage3/out/nabu-stage3-handoff.img
          (cd stage3 && sha256sum --check out/SHA256SUMS.txt)
      - name: Build read-only Stage 6 ABL memory audit
        run: bash stage6/build.sh
      - name: Validate Stage 6 boot.img v3 and hash
        run: |
          python3 stage3/tools/bootimg.py inspect stage6/out/nabu-stage6-audit.img
          (cd stage6 && sha256sum --check out/SHA256SUMS.txt)
          python3 -m unittest discover -s stage6/tests -v
      - name: Assert no redistribution of personal data
        run: python3 tools/repository_guard.py
      - name: Upload temporary Stage 6 diagnostic only
        uses: actions/upload-artifact@v4
        with:
          name: nabu-stage6-readonly-fdt-audit-NOT-XNU
          path: |
            stage6/README.md
            stage6/tools/preflight.ps1
            stage6/out/nabu-stage6-audit.img
            stage6/out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
