name: Verify Stage 3 and Stage 4

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-nabu-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Source and offline unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository contents
        run: |
          set -euo pipefail
          python3 tools/repository_guard.py
          test -s stage3/src/handoff.c
          test -s stage4/tools/mkadt_nabu.py
      - name: Stage 3 Python unit tests
        run: python3 -m unittest discover -s stage3/tests -v
      - name: Stage 4 Python unit tests
        run: python3 -m unittest discover -s stage4/tests -v

  arm64:
    name: Cross-compile Stage 3 test shim
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM cross compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm binutils python3
      - name: Build minimal ARM64 diagnostic
        run: bash stage3/build.sh
      - name: Verify generated boot header and ramdisk
        run: |
          python3 -m unittest discover -s stage3/tests -v
          python3 stage3/tools/bootimg.py inspect stage3/out/nabu-stage3-handoff.img
          (cd stage3 && sha256sum --check out/SHA256SUMS.txt)
      - name: Assert no redistribution of personal data
        run: python3 tools/repository_guard.py
